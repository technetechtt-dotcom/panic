# Candidate only: requires three hosts/zones, managed HA data services,
# real immutable images, TLS ingress and a secret manager before deployment.
apiVersion: v1
kind: Namespace
metadata: {name: guardian}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: guardian-api, namespace: guardian}
spec:
  replicas: 3
  selector:
    matchLabels: {app: guardian-api}
  template:
    metadata:
      labels: {app: guardian-api}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: guardian-api}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: guardian-api}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: ghcr.io/technetechtt-dotcom/panic-api:REPLACE_WITH_RELEASE
          command: [node, dist/main.js]
          ports: [{containerPort: 3000}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: TRUST_PROXY, value: 'true'}
            - {name: EVIDENCE_REMOTE_REQUIRED, value: 'true'}
            - {name: GUARDIAN_REQUIRE_DELIVERY_PROVIDER, value: 'true'}
            - {name: EVIDENCE_VAULT_DIR, value: /tmp/evidence-cache}
          envFrom:
            - secretRef: {name: guardian-runtime}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 1Gi}
          startupProbe:
            httpGet: {path: /api/v1/health/ready, port: 3000}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /api/v1/health/ready, port: 3000}
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: guardian-api, namespace: guardian}
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: guardian-api}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: guardian}
spec:
  selector: {app: guardian-api}
  ports: [{port: 3000, targetPort: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: guardian-web, namespace: guardian}
spec:
  replicas: 3
  selector:
    matchLabels: {app: guardian-web}
  template:
    metadata:
      labels: {app: guardian-web}
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: guardian-web}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: guardian-web}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: ghcr.io/technetechtt-dotcom/panic-web:REPLACE_WITH_RELEASE
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: guardian-web, namespace: guardian}
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: guardian-web}
---
apiVersion: v1
kind: Service
metadata: {name: guardian-web, namespace: guardian}
spec:
  selector: {app: guardian-web}
  ports: [{port: 80, targetPort: 80}]
