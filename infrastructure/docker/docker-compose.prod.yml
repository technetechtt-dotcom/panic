services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-guardian}
    volumes:
      - guardian_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-guardian}
      REDIS_URL: redis://redis:6379
      EVIDENCE_VAULT_DIR: /app/data/evidence-vault
      TRUST_PROXY: "true"
    volumes:
      - guardian_evidence:/app/data/evidence-vault
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: apps/monitoring-web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-guardian}
    volumes:
      - guardian_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump --dbname "$$DATABASE_URL" --format=plain --file "/backups/guardian-$$stamp.sql"
          find /backups -name 'guardian-*.sql' -mtime +14 -delete
          sleep 86400
        done

volumes:
  guardian_postgres:
  guardian_evidence:
  guardian_backups:
