services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-guardian}
    volumes:
      - guardian_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api: &api
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    env_file: ../../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-guardian}
      REDIS_URL: redis://redis:6379
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL to the Guardian Room HTTPS origin}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set independent MFA_ENCRYPTION_KEY}
      MAP_TILE_URL: ${VITE_MAP_TILE_URL:?Set production map tile template}
      ROUTER_URL: ${ROUTER_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      EVIDENCE_VAULT_KEY: ${EVIDENCE_VAULT_KEY:?Set EVIDENCE_VAULT_KEY}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL to the public HTTPS API origin}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the monitoring hub origin}
      DEEP_LINK_BASE: ${DEEP_LINK_BASE:?Set DEEP_LINK_BASE to the verified links host}
      GUARDIAN_REQUIRE_DELIVERY_PROVIDER: "true"
      EVIDENCE_VAULT_DIR: /app/data/evidence-vault
      EVIDENCE_REMOTE_REQUIRED: "true"
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET for authoritative evidence storage}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT for authoritative evidence storage}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      GEOCODER_URL: ${GEOCODER_URL:?Set approved production GEOCODER_URL}
      BACKUP_STATUS_DIR: /app/data/backups
      TRUST_PROXY: "true"
      SMTP_URL: ${SMTP_URL:?Set SMTP_URL to an smtp:// or smtps:// URL}
    volumes:
      - guardian_evidence:/app/data/evidence-vault
      - guardian_backups:/app/data/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-replica:
    <<: *api

  web:
    build:
      context: ../..
      dockerfile: apps/monitoring-web/Dockerfile
      args:
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:?Set a production-approved VITE_MAP_TILE_URL}
        VITE_MAP_TILE_ATTRIBUTION: ${VITE_MAP_TILE_ATTRIBUTION:?Set VITE_MAP_TILE_ATTRIBUTION}
    ports:
      - "80:80"
      - "443:443"
    environment:
      GUARDIAN_TLS_SELF_SIGNED: ${GUARDIAN_TLS_SELF_SIGNED:-}
      GUARDIAN_TLS_CN: ${GUARDIAN_TLS_CN:-localhost}
      GUARDIAN_ANDROID_CERT_SHA256: ${GUARDIAN_ANDROID_CERT_SHA256:?Set SHA-256 fingerprint of the production Android signing certificate}
      GUARDIAN_ANDROID_PACKAGE: ${GUARDIAN_ANDROID_PACKAGE:-za.co.guardian.app}
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - guardian_tls:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/nginx-entrypoint.sh"]
    depends_on:
      api:
        condition: service_healthy
      api-replica:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-guardian}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-guardian/db}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set BACKUP_ENCRYPTION_KEY for encrypted production backups}
    volumes:
      - guardian_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache openssl >/dev/null
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          plain="/backups/guardian-$$stamp.sql.tmp"
          file="/backups/guardian-$$stamp.sql.enc"
          if pg_dump --dbname "$$DATABASE_URL" --format=plain --file "$$plain"; then
            if openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$$plain" -out "$$file" -pass env:BACKUP_ENCRYPTION_KEY; then
              rm -f "$$plain"
              sha256sum "$$file" > "$$file.sha256"
              if [ -n "$${BACKUP_S3_BUCKET:-}" ] && [ -n "$${BACKUP_S3_ACCESS_KEY_ID:-}" ] && [ -n "$${BACKUP_S3_SECRET_ACCESS_KEY:-}" ]; then
                if ! command -v aws >/dev/null 2>&1; then apk add --no-cache aws-cli >/dev/null; fi
                prefix=$${BACKUP_S3_PREFIX:-guardian/db}
                prefix=$${prefix%/}
                export AWS_ACCESS_KEY_ID="$$BACKUP_S3_ACCESS_KEY_ID"
                export AWS_SECRET_ACCESS_KEY="$$BACKUP_S3_SECRET_ACCESS_KEY"
                export AWS_DEFAULT_REGION="$${BACKUP_S3_REGION:-auto}"
                extra=""
                if [ -n "$${BACKUP_S3_ENDPOINT:-}" ]; then extra="--endpoint-url $$BACKUP_S3_ENDPOINT"; fi
                if aws s3 cp "$$file" "s3://$$BACKUP_S3_BUCKET/$$prefix/$$(basename $$file)" $$extra && aws s3 cp "$$file.sha256" "s3://$$BACKUP_S3_BUCKET/$$prefix/$$(basename $$file).sha256" $$extra; then
                  echo "encrypted off-host backup uploaded"
                else
                  echo "off-host upload failed; encrypted local dump kept" >&2
                fi
              else
                echo "BACKUP_S3_* is incomplete, so the encrypted dump stayed on the backup volume."
              fi
            else
              echo "backup encryption failed" >&2
              rm -f "$$file"
            fi
          else
            echo "pg_dump failed" >&2
          fi
          rm -f "$$plain"
          find /backups -name 'guardian-*.sql.enc' -mtime +14 -delete
          find /backups -name 'guardian-*.sql.enc.sha256' -mtime +14 -delete
          sleep 86400
        done

  postgres-restore:
    profiles: ["restore-verify"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: restore-only-not-production
      POSTGRES_DB: guardian_restore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian_restore"]
      interval: 5s
      timeout: 5s
      retries: 20

  restore-verify:
    profiles: ["restore-verify"]
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-guardian}
      BACKUP_VERIFY_DATABASE_URL: postgresql://guardian:restore-only-not-production@postgres-restore:5432/guardian_restore
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set BACKUP_ENCRYPTION_KEY}
    volumes:
      - guardian_backups:/backups:ro
      - ../../services/api/scripts/backup-restore-verify.mjs:/verify.mjs:ro
    depends_on:
      postgres-restore:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache nodejs openssl >/dev/null
        ls -1 /backups/guardian-*.sql.enc | tail -n 1 | xargs node /verify.mjs

volumes:
  guardian_postgres:
  guardian_evidence:
  guardian_backups:
  guardian_tls:
