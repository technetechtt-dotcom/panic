name: Signed Android release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      RELEASE_API_BASE_URL: ${{ secrets.RELEASE_API_BASE_URL }}
      GUARDIAN_UPLOAD_STORE_BASE64: ${{ secrets.GUARDIAN_UPLOAD_STORE_BASE64 }}
      GUARDIAN_UPLOAD_STORE_PASSWORD: ${{ secrets.GUARDIAN_UPLOAD_STORE_PASSWORD }}
      GUARDIAN_UPLOAD_KEY_ALIAS: ${{ secrets.GUARDIAN_UPLOAD_KEY_ALIAS }}
      GUARDIAN_UPLOAD_KEY_PASSWORD: ${{ secrets.GUARDIAN_UPLOAD_KEY_PASSWORD }}
      RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.RELEASE_SIGNING_PUBLIC_KEY }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REF: ${{ github.ref }}
      GUARDIAN_VERSION_CODE: ${{ vars.GUARDIAN_RELEASE_VERSION_CODE }}
      GUARDIAN_VERSION_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require real release configuration and signed tag
        shell: bash
        run: |
          set -euo pipefail
          for key in GOOGLE_SERVICES_JSON RELEASE_API_BASE_URL GUARDIAN_UPLOAD_STORE_BASE64 GUARDIAN_UPLOAD_STORE_PASSWORD GUARDIAN_UPLOAD_KEY_ALIAS GUARDIAN_UPLOAD_KEY_PASSWORD RELEASE_SIGNING_PUBLIC_KEY; do
            if [ -z "${!key}" ]; then echo "Missing release configuration: $key"; exit 1; fi
          done
          if ! [[ "$GUARDIAN_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || [ "$GUARDIAN_VERSION_CODE" -gt 2100000000 ]; then echo "Set GUARDIAN_RELEASE_VERSION_CODE to a valid monotonically increasing Android version code in the release environment."; exit 1; fi
          case "$RELEASE_REF" in refs/tags/v*) ;; *) echo "Select a signed v* tag for a production release."; exit 1 ;; esac
          printf '%s' "$RELEASE_SIGNING_PUBLIC_KEY" | gpg --import
          git verify-tag "$RELEASE_TAG"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Build signed APK and bundle
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$GUARDIAN_UPLOAD_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/guardian-upload.jks"
          export GUARDIAN_UPLOAD_STORE_FILE="$RUNNER_TEMP/guardian-upload.jks"
          trap 'rm -f "$GUARDIAN_UPLOAD_STORE_FILE" app/google-services.json' EXIT
          bash ./gradlew :app:checkSignedBundleConfig :app:assembleRelease :app:bundleRelease --no-daemon -PreleaseApiBaseUrl="$RELEASE_API_BASE_URL"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab release-artifacts/
          (cd release-artifacts && sha256sum app-release.apk app-release.aab > SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/android/release-artifacts/*
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-android-signed-release
          path: apps/android/release-artifacts/
          if-no-files-found: error
          retention-days: 90
