name: CI

on:
  push:
  pull_request:

jobs:
  backend-dashboard-security:
    name: Backend, dashboard, security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: guardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GUARDIAN_PG_TEST: "1"
      DATABASE_URL: postgresql://guardian:change-me@localhost:5432/guardian?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build workspace packages
        run: npm run build -w @guardian/shared-types && npm run build -w @guardian/shared-validation
      - name: Generate Prisma client and migrate
        run: |
          npx prisma generate --schema services/api/prisma/schema.prisma
          npx prisma migrate deploy --schema services/api/prisma/schema.prisma
      - name: Test API, validation, and dashboard
        run: npm test
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  android:
    name: Android unit tests, lint, debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept licenses and install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests, lint, and debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Release config check
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        working-directory: apps/android
        run: |
          set +e
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ] && [ -n "${{ secrets.RELEASE_API_BASE_URL }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            ./gradlew :app:checkReleaseConfig :app:assembleRelease --no-daemon -PreleaseApiBaseUrl="${{ secrets.RELEASE_API_BASE_URL }}"
            exit $?
          fi
          ./gradlew :app:checkReleaseConfig --no-daemon
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "checkReleaseConfig must fail when production configuration is absent."
            exit 1
          fi
          exit 0
