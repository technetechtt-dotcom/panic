name: CI

on:
  push:
  pull_request:

jobs:
  backend-dashboard-security:
    name: Backend, dashboard, security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: guardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GUARDIAN_PG_TEST: "1"
      DATABASE_URL: postgresql://guardian:change-me@localhost:5432/guardian?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build workspace packages
        run: npm run build -w @guardian/shared-types && npm run build -w @guardian/shared-validation
      - name: Generate Prisma client and migrate
        run: |
          npx prisma generate --schema services/api/prisma/schema.prisma
          npx prisma migrate deploy --schema services/api/prisma/schema.prisma
      - name: Validate production operations configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          JWT_ACCESS_SECRET: ci-jwt-secret-that-is-long-enough-for-hs256
          MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-that-is-separate-and-long
          PUBLIC_WEB_URL: https://guardian.example.test
          EVIDENCE_VAULT_KEY: ci-evidence-vault-key-that-is-long-enough
          PUBLIC_API_URL: https://api.guardian.test
          CORS_ORIGIN: https://hub.guardian.test
          DEEP_LINK_BASE: https://links.guardian.test
          SMTP_URL: smtps://mailer:secret@smtp.guardian.test:465
          S3_BUCKET: guardian-ci-evidence
          S3_ENDPOINT: https://objects.guardian.test
          S3_ACCESS_KEY_ID: ci-access
          S3_SECRET_ACCESS_KEY: ci-secret
          GEOCODER_URL: https://geocoder.guardian.test/search
          VITE_MAP_TILE_URL: https://tiles.guardian.test/{z}/{x}/{y}.png
          VITE_MAP_TILE_ATTRIBUTION: Guardian CI Tiles
          GUARDIAN_ANDROID_CERT_SHA256: 11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00
          BACKUP_ENCRYPTION_KEY: ci-backup-secret-that-is-long-enough
        run: |
          set -euo pipefail
          for file in services/api/scripts/*.mjs; do node --check "$file"; done
          sh -n infrastructure/docker/nginx-entrypoint.sh
          : > .env
          docker compose -f infrastructure/docker/docker-compose.prod.yml config >/dev/null
      - name: Test API, validation, and dashboard
        run: npm test
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  android:
    name: Android unit tests, lint, debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept licenses and install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests, lint, and debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Release configuration rejects missing production inputs
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        working-directory: apps/android
        run: |
          if ./gradlew :app:checkReleaseConfig --no-daemon; then
            echo "Release configuration must reject missing production inputs."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
